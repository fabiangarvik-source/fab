<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vote for today's Himmest, snap Himmest moments, log him quotes and bet on the Him of the Week.">
<meta name="theme-color" content="#16142e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Himmest">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>The Himmest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Familjen+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a game-show arena. Jumbotron header + ticker, five sections behind one nav (top on desktop, thumb bar on phones), sticker-style cards. */
:root{
  --bg:#f2f0ff; --panel:#ffffff; --ink:#16142e; --muted:#5f5c80; --line:#dcd8f0;
  --accent:#2f45ff; --accent-ink:#ffffff; --pop:#ff3d8b; --pop-ink:#ffffff;
  --hi:#ffe14d; --hi-ink:#16142e; --good:#11894a; --bad:#c42a3a;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110f24; --panel:#1b1936; --ink:#f0eeff; --muted:#a6a2cc; --line:#302d55;
  --accent:#7184ff; --accent-ink:#0e0c20; --pop:#ff6aa6; --pop-ink:#16142e;
  --hi:#ffe14d; --hi-ink:#16142e; --good:#4fd58c; --bad:#ff7b88; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#110f24; --panel:#1b1936; --ink:#f0eeff; --muted:#a6a2cc; --line:#302d55;
  --accent:#7184ff; --accent-ink:#0e0c20; --pop:#ff6aa6; --pop-ink:#16142e;
  --hi:#ffe14d; --hi-ink:#16142e; --good:#4fd58c; --bad:#ff7b88; color-scheme:dark }
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.authtabs{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:14px}
.authtabs button{flex:1;border:0;background:transparent;padding:9px;font-weight:700}
.authtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.install{display:flex;gap:12px;align-items:flex-start;background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px}
.install b{font-family:var(--display);font-weight:400}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(1.25rem,3.6vw,1.6rem)} h3{font-size:1.05rem}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button,label.btn{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.word{font-family:var(--display);font-size:clamp(1.9rem,7vw,3.2rem);line-height:.9;display:flex;align-items:center;gap:.25em}
.word span{background:var(--hi);color:var(--hi-ink);padding:.04em .16em;border-radius:8px;transform:rotate(-2deg);display:inline-block}
.tag{font-size:.92rem;color:var(--muted);margin-top:6px}
.mebtn{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;max-width:100%}
.mebtn .hb{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.mebtn .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}

.ticker{overflow:hidden;border-block:3px solid var(--ink);margin-block:6px 14px;white-space:nowrap;background:var(--ink);color:var(--bg)}
.ticker .run{display:inline-block;padding-block:7px;animation:tick 55s linear infinite;font-family:var(--mono);font-size:.86rem}
.ticker .run b{font-family:var(--display);font-weight:400;background:var(--hi);color:var(--hi-ink);padding:1px 7px;margin-inline:16px 8px;border-radius:4px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

nav.tabs{display:flex;gap:8px;margin-bottom:18px}
nav.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--panel);border-radius:12px;padding:9px 10px;font-weight:700}
nav.tabs button svg{width:20px;height:20px;flex:none}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--pop)}
@media (max-width:760px){
  body{padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:5;background:var(--panel);border-top:2px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
  nav.tabs button{flex-direction:column;gap:2px;border:0;border-radius:10px;padding:6px 2px;font-size:.72rem;background:transparent}
  nav.tabs button[aria-selected="true"]{box-shadow:none}
}

.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:860px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.loud{border-color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.card.pink{border-color:var(--ink);box-shadow:6px 6px 0 var(--pop)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.hero{border:3px solid var(--ink);border-radius:var(--r);padding:18px;background:
  repeating-linear-gradient(135deg,transparent 0 18px,color-mix(in srgb,var(--hi) 30%,transparent) 18px 20px),var(--panel);display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(1.6rem,6vw,2.6rem)}
.hero .q{font-size:1.1rem;font-weight:700}
.commentary{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-weight:500}
.commentary b{font-family:var(--display);font-weight:400;color:var(--hi);white-space:nowrap}

.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.vcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:16px 10px 12px;transition:transform .12s}
.vcard:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.vcard.picked{background:var(--hi);color:var(--hi-ink);box-shadow:4px 4px 0 var(--ink)}
.vcard.picked .muted,.vcard.picked .label,.vcard.picked .brain .t{color:var(--hi-ink);opacity:.8}
.vcard:disabled{cursor:default}
.vcard .nmv{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.vcard .votes{font-family:var(--display);font-size:1.5rem;line-height:1}
.sticker{position:absolute;top:-10px;right:-6px;background:var(--pop);color:var(--pop-ink);font-family:var(--display);font-size:.72rem;padding:3px 8px;border-radius:6px;transform:rotate(6deg);border:2px solid var(--ink)}
.sticker.lead{left:-6px;right:auto;transform:rotate(-6deg);background:var(--hi);color:var(--hi-ink)}

.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.95rem;color:#fff;flex:none;overflow:hidden;border:2px solid var(--ink)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:72px;height:72px;font-size:1.4rem}
.av.xl{width:96px;height:96px;font-size:1.9rem}
.av.sm{width:30px;height:30px;font-size:.7rem;border-width:1.5px}

.brain{width:100%;max-width:130px}
.brain .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.brain .meter i{display:block;height:100%;background:var(--pop)}
.brain .t{font-family:var(--mono);font-size:.68rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{border-color:var(--line);font-weight:500;padding:5px 10px;font-size:.88rem}
.btn.huge{font-family:var(--display);font-weight:400;font-size:1.05rem;padding:14px 16px;flex:1;box-shadow:4px 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
input,select,textarea{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:84px}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:999px;padding:4px 11px;background:transparent;font-size:.86rem;font-weight:700}
.people{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.person{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;border-radius:12px;background:transparent;padding:6px;min-width:72px;font-size:.8rem;font-weight:700}
.person[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.preview{width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:2px solid var(--ink);background:var(--bg)}

.bubble{position:relative;background:var(--bg);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;font-size:1.2rem;font-weight:700;overflow-wrap:anywhere}
.bubble::after{content:"";position:absolute;left:26px;bottom:-11px;width:18px;height:18px;background:var(--bg);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble.gold{background:var(--hi);color:var(--hi-ink);font-size:clamp(1.25rem,4vw,1.7rem)}
.bubble.gold::after{background:var(--hi)}
.qitem{display:flex;flex-direction:column;gap:14px;padding-block:14px;border-bottom:2px dashed var(--line)}
.qitem:last-child{border-bottom:0}
.byline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.byline strong{color:var(--ink)}
.byline .sp{flex:1}

.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.moment{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:10px;min-width:0}
.moment .pic{padding:0;border:0;border-radius:10px;overflow:hidden;background:var(--line);aspect-ratio:4/5;cursor:zoom-in;max-width:100%}
.moment .pic img{width:100%;height:100%;object-fit:cover;display:block}
.moment .cap{font-weight:700;overflow-wrap:anywhere}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:2px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:.88rem;display:inline-flex;gap:4px;align-items:center}
.react[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.react:disabled{cursor:default;opacity:.7}
.spot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.spot{grid-template-columns:minmax(0,1fr)}}
.spot img{width:100%;border-radius:10px;border:2px solid var(--ink);aspect-ratio:4/5;object-fit:cover;cursor:zoom-in}

.row{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding-block:9px;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.rank{font-family:var(--display);text-align:center;color:var(--muted)}
.rank.gold{color:var(--ink)}
.nm{font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.sub{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.pts{font-family:var(--mono);font-weight:500;text-align:right;white-space:nowrap}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-weight:700;border-right:2px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stat{display:flex;justify-content:space-between;gap:10px;padding-block:7px;border-bottom:2px dashed var(--line)}
.stat:last-child{border-bottom:0}
.big{font-family:var(--display);font-size:2.3rem;line-height:1}
.pill{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:2px 9px;border-radius:999px;border:2px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{border-color:var(--good);color:var(--good)} .pill.closed{border-color:var(--bad);color:var(--bad)}
.won{color:var(--good)} .lost{color:var(--bad)}
.empty{padding:20px 6px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.1rem;margin-bottom:4px}
.wallet{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px 18px}
.wallet .big{color:var(--hi)}
.wallet p{opacity:.75}
.slip{border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:.84rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trophies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.trophies div{border:2px solid var(--line);border-radius:10px;padding:8px 4px}
.trophies .big{font-size:1.6rem}
.gate{max-width:560px;margin:24px auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);z-index:20;border:2px solid var(--hi)}
.lightbox{position:fixed;inset:0;background:rgba(10,9,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:30;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:78vh;border-radius:10px}
.lightbox p{color:#fff;font-weight:700;text-align:center;max-width:60ch;overflow-wrap:anywhere}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){.ticker .run{animation:none}.vcard{transition:none}}

/* ---- v2 components ---- */
.roast{display:flex;gap:8px;align-items:flex-start;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 11px;font-size:.92rem;font-weight:500;line-height:1.35}
.roast b{font-family:var(--display);font-weight:400;color:var(--hi);white-space:nowrap;font-size:.78rem;padding-top:2px}
.roast.wait span{opacity:.6}
.charges{display:flex;flex-direction:column;gap:8px;width:100%}
.charge{background:var(--bg);border:2px dashed var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.charge q{font-weight:700;quotes:"\201C" "\201D"}
.charge .by{font-size:.78rem;color:var(--muted);margin-top:2px}
.nom{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:14px;position:relative}
.nom.picked{box-shadow:5px 5px 0 var(--hi)}
.nom .top{display:flex;align-items:center;gap:12px}
.nom .count{margin-left:auto;text-align:center}
.nom .count .votes{font-family:var(--display);font-size:1.8rem;line-height:1}
.stamp{display:inline-block;font-family:var(--display);font-size:.72rem;padding:2px 8px;border:2px solid currentColor;border-radius:6px;transform:rotate(-3deg)}
.stamp.trial{color:var(--pop)} .stamp.free{color:var(--good)}
.trialbox{border:2px solid var(--pop);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.trialbox .defense{font-weight:700;overflow-wrap:anywhere}
.king{border:3px solid var(--ink);border-radius:var(--r);padding:16px;background:linear-gradient(135deg,var(--hi),color-mix(in srgb,var(--hi) 60%,var(--pop)));color:var(--hi-ink);display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--ink)}
.king h2{font-size:clamp(1.3rem,5vw,1.9rem)}
.king .law{background:rgba(255,255,255,.55);border:2px solid var(--hi-ink);border-radius:10px;padding:9px 11px}
.king .law .label{color:var(--hi-ink);opacity:.8}
.king .law p{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.king input,.king textarea{background:#fff;color:#16142e;border-color:var(--hi-ink)}
.king .muted{color:var(--hi-ink);opacity:.8}
.comments{display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line);padding-top:8px}
.cmt{font-size:.9rem;overflow-wrap:anywhere}
.cmt b{margin-right:4px}
.cmt .x{border:0;background:none;color:var(--muted);font-size:.8rem;cursor:pointer;margin-left:4px}
.cform{display:flex;gap:6px}
.cform input{padding:6px 10px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;cursor:pointer;font-size:.86rem;text-align:left}
.month{display:flex;flex-direction:column;gap:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(30%,110px),1fr));gap:6px}
.thumbs button{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--line);cursor:zoom-in}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.recap{display:flex;flex-direction:column;gap:10px}
.recap .rrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding-block:6px;border-bottom:2px dashed var(--line)}
.recap .rrow:last-child{border-bottom:0}
.recap .ic{font-size:1.3rem;width:1.6em;text-align:center}
.receipts .r{display:flex;align-items:center;gap:6px;font-size:.9rem;padding-block:4px}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ceremony{position:fixed;inset:0;z-index:40;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.ceremony .pre{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hi);font-size:.8rem}
.ceremony h1{font-size:clamp(1.8rem,8vw,3rem);color:var(--bg)}
.ceremony .drum{font-family:var(--display);font-size:5rem;color:var(--hi);line-height:1}
.ceremony .crownav{position:relative;padding-top:34px}
.ceremony .crownav::before{content:"👑";position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:3rem}
.ceremony .av.xl{width:140px;height:140px;font-size:2.6rem;border:4px solid var(--hi)}
.ceremony .roast{max-width:30rem;background:var(--panel);color:var(--ink);text-align:left}
