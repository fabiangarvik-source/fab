<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vote for today's Himmest, snap Himmest moments, log him quotes and bet on the Him of the Week.">
<meta name="theme-color" content="#16142e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Himmest">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>The Himmest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Familjen+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a game-show arena. Jumbotron header + ticker, five sections behind one nav (top on desktop, thumb bar on phones), sticker-style cards. */
:root{
  --bg:#f2f0ff; --panel:#ffffff; --ink:#16142e; --muted:#5f5c80; --line:#dcd8f0;
  --accent:#2f45ff; --accent-ink:#ffffff; --pop:#ff3d8b; --pop-ink:#ffffff;
  --hi:#ffe14d; --hi-ink:#16142e; --good:#11894a; --bad:#c42a3a;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110f24; --panel:#1b1936; --ink:#f0eeff; --muted:#a6a2cc; --line:#302d55;
  --accent:#7184ff; --accent-ink:#0e0c20; --pop:#ff6aa6; --pop-ink:#16142e;
  --hi:#ffe14d; --hi-ink:#16142e; --good:#4fd58c; --bad:#ff7b88; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#110f24; --panel:#1b1936; --ink:#f0eeff; --muted:#a6a2cc; --line:#302d55;
  --accent:#7184ff; --accent-ink:#0e0c20; --pop:#ff6aa6; --pop-ink:#16142e;
  --hi:#ffe14d; --hi-ink:#16142e; --good:#4fd58c; --bad:#ff7b88; color-scheme:dark }
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.authtabs{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:14px}
.authtabs button{flex:1;border:0;background:transparent;padding:9px;font-weight:700}
.authtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.install{display:flex;gap:12px;align-items:flex-start;background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px}
.install b{font-family:var(--display);font-weight:400}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(1.25rem,3.6vw,1.6rem)} h3{font-size:1.05rem}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button,label.btn{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.word{font-family:var(--display);font-size:clamp(1.9rem,7vw,3.2rem);line-height:.9;display:flex;align-items:center;gap:.25em}
.word span{background:var(--hi);color:var(--hi-ink);padding:.04em .16em;border-radius:8px;transform:rotate(-2deg);display:inline-block}
.tag{font-size:.92rem;color:var(--muted);margin-top:6px}
.mebtn{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;max-width:100%}
.mebtn .hb{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.mebtn .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}

.ticker{overflow:hidden;border-block:3px solid var(--ink);margin-block:6px 14px;white-space:nowrap;background:var(--ink);color:var(--bg)}
.ticker .run{display:inline-block;padding-block:7px;animation:tick 55s linear infinite;font-family:var(--mono);font-size:.86rem}
.ticker .run b{font-family:var(--display);font-weight:400;background:var(--hi);color:var(--hi-ink);padding:1px 7px;margin-inline:16px 8px;border-radius:4px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

nav.tabs{display:flex;gap:8px;margin-bottom:18px}
nav.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--panel);border-radius:12px;padding:9px 10px;font-weight:700}
nav.tabs button svg{width:20px;height:20px;flex:none}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--pop)}
@media (max-width:760px){
  body{padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:5;background:var(--panel);border-top:2px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
  nav.tabs button{flex-direction:column;gap:2px;border:0;border-radius:10px;padding:6px 2px;font-size:.72rem;background:transparent}
  nav.tabs button[aria-selected="true"]{box-shadow:none}
}

.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:860px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.loud{border-color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.card.pink{border-color:var(--ink);box-shadow:6px 6px 0 var(--pop)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.hero{border:3px solid var(--ink);border-radius:var(--r);padding:18px;background:
  repeating-linear-gradient(135deg,transparent 0 18px,color-mix(in srgb,var(--hi) 30%,transparent) 18px 20px),var(--panel);display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(1.6rem,6vw,2.6rem)}
.hero .q{font-size:1.1rem;font-weight:700}
.commentary{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-weight:500}
.commentary b{font-family:var(--display);font-weight:400;color:var(--hi);white-space:nowrap}

.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.vcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:16px 10px 12px;transition:transform .12s}
.vcard:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.vcard.picked{background:var(--hi);color:var(--hi-ink);box-shadow:4px 4px 0 var(--ink)}
.vcard.picked .muted,.vcard.picked .label,.vcard.picked .brain .t{color:var(--hi-ink);opacity:.8}
.vcard:disabled{cursor:default}
.vcard .nmv{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.vcard .votes{font-family:var(--display);font-size:1.5rem;line-height:1}
.sticker{position:absolute;top:-10px;right:-6px;background:var(--pop);color:var(--pop-ink);font-family:var(--display);font-size:.72rem;padding:3px 8px;border-radius:6px;transform:rotate(6deg);border:2px solid var(--ink)}
.sticker.lead{left:-6px;right:auto;transform:rotate(-6deg);background:var(--hi);color:var(--hi-ink)}

.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.95rem;color:#fff;flex:none;overflow:hidden;border:2px solid var(--ink)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:72px;height:72px;font-size:1.4rem}
.av.xl{width:96px;height:96px;font-size:1.9rem}
.av.sm{width:30px;height:30px;font-size:.7rem;border-width:1.5px}

.brain{width:100%;max-width:130px}
.brain .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.brain .meter i{display:block;height:100%;background:var(--pop)}
.brain .t{font-family:var(--mono);font-size:.68rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{border-color:var(--line);font-weight:500;padding:5px 10px;font-size:.88rem}
.btn.huge{font-family:var(--display);font-weight:400;font-size:1.05rem;padding:14px 16px;flex:1;box-shadow:4px 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
input,select,textarea{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:84px}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:999px;padding:4px 11px;background:transparent;font-size:.86rem;font-weight:700}
.people{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.person{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;border-radius:12px;background:transparent;padding:6px;min-width:72px;font-size:.8rem;font-weight:700}
.person[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.preview{width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:2px solid var(--ink);background:var(--bg)}

.bubble{position:relative;background:var(--bg);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;font-size:1.2rem;font-weight:700;overflow-wrap:anywhere}
.bubble::after{content:"";position:absolute;left:26px;bottom:-11px;width:18px;height:18px;background:var(--bg);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble.gold{background:var(--hi);color:var(--hi-ink);font-size:clamp(1.25rem,4vw,1.7rem)}
.bubble.gold::after{background:var(--hi)}
.qitem{display:flex;flex-direction:column;gap:14px;padding-block:14px;border-bottom:2px dashed var(--line)}
.qitem:last-child{border-bottom:0}
.byline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.byline strong{color:var(--ink)}
.byline .sp{flex:1}

.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.moment{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r);padding:10px;min-width:0}
.moment .pic{padding:0;border:0;border-radius:10px;overflow:hidden;background:var(--line);aspect-ratio:4/5;cursor:zoom-in;max-width:100%}
.moment .pic img{width:100%;height:100%;object-fit:cover;display:block}
.moment .cap{font-weight:700;overflow-wrap:anywhere}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:2px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:.88rem;display:inline-flex;gap:4px;align-items:center}
.react[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.react:disabled{cursor:default;opacity:.7}
.spot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.spot{grid-template-columns:minmax(0,1fr)}}
.spot img{width:100%;border-radius:10px;border:2px solid var(--ink);aspect-ratio:4/5;object-fit:cover;cursor:zoom-in}

.row{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding-block:9px;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.rank{font-family:var(--display);text-align:center;color:var(--muted)}
.rank.gold{color:var(--ink)}
.nm{font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.sub{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.pts{font-family:var(--mono);font-weight:500;text-align:right;white-space:nowrap}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-weight:700;border-right:2px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stat{display:flex;justify-content:space-between;gap:10px;padding-block:7px;border-bottom:2px dashed var(--line)}
.stat:last-child{border-bottom:0}
.big{font-family:var(--display);font-size:2.3rem;line-height:1}
.pill{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:2px 9px;border-radius:999px;border:2px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{border-color:var(--good);color:var(--good)} .pill.closed{border-color:var(--bad);color:var(--bad)}
.won{color:var(--good)} .lost{color:var(--bad)}
.empty{padding:20px 6px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:400;font-size:1.1rem;margin-bottom:4px}
.wallet{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px 18px}
.wallet .big{color:var(--hi)}
.wallet p{opacity:.75}
.slip{border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:.84rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trophies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.trophies div{border:2px solid var(--line);border-radius:10px;padding:8px 4px}
.trophies .big{font-size:1.6rem}
.gate{max-width:560px;margin:24px auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);z-index:20;border:2px solid var(--hi)}
.lightbox{position:fixed;inset:0;background:rgba(10,9,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:30;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:78vh;border-radius:10px}
.lightbox p{color:#fff;font-weight:700;text-align:center;max-width:60ch;overflow-wrap:anywhere}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){.ticker .run{animation:none}.vcard{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="word">THE <span>HIMMEST</span></div>
      <div class="tag">The daily award nobody asked for and everybody deserves.</div>
    </div>
    <div id="who"></div>
  </header>
  <div class="ticker" aria-hidden="true"><div class="run" id="ticker"></div></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections" hidden></nav>
  <main id="main">
    <div class="card empty"><strong>Warming up the jumbotron…</strong>Loading today's race.</div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
const TZ = "America/New_York";
const START_HB = 1000, ALLOW_HB = 25, FLOOR_HB = 100;
const PTS_VOTE = 3, PTS_CROWN = 5, PTS_QUOTE = 1, PTS_REACT = 1;
const PHOTO_KEEP = 12, PHOTO_DOC_MAX = 150000;
const COLS = ["profiles","votes","quotes","qvotes","vetoes","bets","photos","reacts"];

const ARCHETYPES = [
  "Golden Retriever In Human Form","Gym Rat With A Heart Of Gold","Uses \"bro\" As Punctuation",
  "Thinks Protein Is A Personality","Got Lost Inside The Library","Main Character Of The Dining Hall",
  "Emotionally Available Himbo","Confidently Wrong, Spiritually Right","Just Happy To Be Here",
  "Would Fight A Goose For You","Owns One Pan And It's For Eggs"
];
const PROMPTS = [
  "Who said the most beautiful thing with the fewest brain cells?",
  "Who asked if the moon counts as a planet?",
  "Who held the door for someone 200 feet away?",
  "Who tried to pay with something that was not money?",
  "Who explained something wrong with total confidence and good intentions?",
  "Who got genuinely emotional about a dog today?",
  "Who did a gym set mid-conversation without being asked?",
  "Who walked into the wrong class and stayed anyway?",
  "Who asked a question that was answered 30 seconds earlier?",
  "Who complimented someone so sincerely it caused a scene?",
  "Who forgot where they live, briefly?",
  "Whose plan today was 100% vibes and 0% plan?",
  "Who pushed a pull door and blamed the door?",
  "Who put something in the microwave that should never go in a microwave?"
];
const TITLES = [[0,"Has At Least Three Thoughts"],[1,"Certified Himbo"],[3,"Golden Retriever Energy"],[7,"Protein Shake Philosopher"],[15,"Himbo Emeritus"],[30,"Too Pure For This World"]];
const REACTS = { dead:["💀","Dead"], zero:["🧠","0 brain cells"], dog:["🐶","Golden retriever"], iconic:["👑","Iconic"] };
const PERIODS = { week:"Him of the Week", month:"Him of the Month", year:"Him of the Year" };
const FILLER = [
  "Weather update: 0% chance of a thought, 100% chance of good intentions",
  "Reminder: the Himmest is an honor. Mostly.",
  "Himbucks are not real money. Please stop trying to Venmo them.",
  "Polls close at midnight. Brains close whenever.",
  "Scientists confirm: being the Himmest burns zero calories"
];
const ICONS = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>',
  moments:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>',
  quotes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  bets:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></svg>',
  ranks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V12h4v8M10 20V6h4v14M16 20v-5h4v5"/></svg>'
};

/* ---------- time ---------- */
function etParts(d = new Date()){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  const p = {}; for (const x of f.formatToParts(d)) p[x.type] = x.value;
  return { day:`${p.year}-${p.month}-${p.day}`, h:(+p.hour)%24, m:+p.minute, s:+p.second };
}
const today = () => etParts().day;
function secsToMidnight(){ const p = etParts(); return 86400 - (p.h*3600+p.m*60+p.s); }

  if (square) { const m = Math.min(sw, sh); sx = (sw-m)/2; sy = (sh-m)/2; sw = sh = m; }

    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(sw*scale)); c.height = Math.max(1, Math.round(sh*scale));
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height);
    g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);

}

/* ---------- derived data (rebuilt each render) ---------- */
function derive(){
  const td = today();
  const quotes = [], photos = [];
  for (const [author, doc] of Object.entries(S.quotes)) {
    if (!isMember(author)) continue;
    for (const q of (doc?.items||[])) {
      if (!q || typeof q.text !== "string" || !isMember(q.about) || typeof q.day !== "string") continue;
      const key = `${author}:${q.k}`;
      if ((S.vetoes[q.about]?.keys||[]).includes(key)) continue;
      quotes.push({ ...q, text:q.text.slice(0,240), author, key });
    }
  }
  for (const [author, doc] of Object.entries(S.photos)) {
    if (!isMember(author)) continue;
    for (const p of (doc?.items||[])) {
      if (!p || !okImg(p.img) || !isMember(p.about) || typeof p.day !== "string") continue;
      const key = `p:${author}:${p.k}`;
      if ((S.vetoes[p.about]?.keys||[]).includes(key)) continue;
      photos.push({ ...p, caption:String(p.caption||"").slice(0,140), author, key });
    }
  }
  quotes.sort((a,b)=>(b.ts||0)-(a.ts||0)); photos.sort((a,b)=>(b.ts||0)-(a.ts||0));
  const qByKey = new Map(quotes.map(q=>[q.key,q])), pByKey = new Map(photos.map(p=>[p.key,p]));
  const pts = {}, add = (d,u,n) => { (pts[d] ||= {}); pts[d][u] = (pts[d][u]||0) + n; };

  const dv = {};
  for (const [voter, v] of Object.entries(S.votes)) {
    if (!isMember(voter)) continue;
    for (const [d, t] of Object.entries(v?.days||{})) {
      if (!isMember(t) || t === voter || d > td) continue;
      (dv[d] ||= {}); dv[d][t] = (dv[d][t]||0) + 1; add(d, t, PTS_VOTE);
    }
  }
  const dw = {};
  for (const [d, t] of Object.entries(dv)) {
    const max = Math.max(0, ...Object.values(t));
    dw[d] = max > 0 ? new Set(Object.keys(t).filter(k=>t[k]===max)) : new Set();
    if (d < td) for (const w of dw[d]) add(d, w, PTS_CROWN);
  }
  const qv = {};
  for (const [voter, v] of Object.entries(S.qvotes)) {
    if (!isMember(voter)) continue;
    for (const [d, k] of Object.entries(v?.days||{})) {
      const q = qByKey.get(k);
      if (!q || q.day !== d || voter === q.author || voter === q.about) continue;
      qv[k] = (qv[k]||0) + 1; add(d, q.about, PTS_QUOTE);
    }
  }
  const rc = {};
  for (const [who, doc] of Object.entries(S.reacts)) {
    if (!isMember(who)) continue;
    for (const [k, type] of Object.entries(doc?.map||{})) {
      const p = pByKey.get(k);
      if (!p || !REACTS[type] || who === p.about) continue;
      const r = (rc[k] ||= { total:0 }); r[type] = (r[type]||0) + 1; r.total++;
      add(p.day, p.about, PTS_REACT);
    }
  }
  return { td, quotes, photos, pts, dv, dw, qv, rc };
}
function standings(start, end){
  const tot = {}; for (const u of members()) tot[u] = 0;
  for (const [d, m] of Object.entries(D.pts)) if (d >= start && d <= end) for (const [u,n] of Object.entries(m)) if (u in tot) tot[u] += n;
  return members().sort((a,b)=>tot[b]-tot[a] || nm(a).localeCompare(nm(b))).map(u=>({ uid:u, pts:tot[u] }));
}
function winnersOfPeriod(per){
  const st = standings(per.start, per.end); const max = st[0]?.pts || 0;
  return max > 0 ? new Set(st.filter(s=>s.pts===max).map(s=>s.uid)) : new Set();
}
function brainCells(uid){

  return Math.max(0, 100 - (s?.pts||0) * 2);

function trophies(uid){
  const td = D.td, out = { day:0, week:0, month:0, year:0 };
  for (const [d, w] of Object.entries(D.dw)) if (d < td && w.has(uid)) out.day++;
  for (const type of ["week","month","year"]) for (const x of pastWinners(type)) if (x.winners.includes(uid)) out[type]++;

function pastWinners(type){

  for (const d of Object.keys(D.pts)) { const per = periodOf(type, d); if (per.end < td && !seen.has(per.key)) seen.set(per.key, per); }

function ledger(){
  const td = D.td, bal = {}, hist = {};
  for (const u of members()) {
    const days = S.votes[u]?.days || {};
    const voted = Object.keys(days).filter(d => d < td && isMember(days[d]) && days[d] !== u).length;
    bal[u] = START_HB + ALLOW_HB * voted; hist[u] = [];
  }
  const groups = {};
  for (const [u, doc] of Object.entries(S.bets)) {
    if (!isMember(u)) continue;
    for (const b of (doc?.items||[])) {
      if (!b || !PERIODS[b.type] || typeof b.day !== "string" || b.day > td || !isMember(b.on)) continue;
      const amt = Math.floor(+b.amt || 0); if (amt < 1) continue;
      const per = periodOf(b.type, b.day); if (b.day === per.end) continue;
      (groups[per.key] ||= { per, list:[] }).list.push({ uid:u, on:b.on, amt, mult:earlyBird(per, b.day), type:b.type, k:b.k });
    }
  }
  const clamp = list => {
    const tot = {}; for (const b of list) tot[b.uid] = (tot[b.uid]||0) + b.amt;
    return list.map(b => { const av = Math.max(0, bal[b.uid]||0); return tot[b.uid] > av ? { ...b, amt:Math.floor(b.amt*av/tot[b.uid]) } : b; }).filter(b=>b.amt>0);
  };
  const floor = () => { for (const u in bal) if (bal[u] < FLOOR_HB) bal[u] = FLOOR_HB; };
  for (const g of Object.values(groups).filter(g=>g.per.end < td).sort((a,b)=>a.per.end.localeCompare(b.per.end))) {
    floor();
    const list = clamp(g.list), pool = list.reduce((a,b)=>a+b.amt,0), win = winnersOfPeriod(g.per);
    const W = list.filter(b=>win.has(b.on)).reduce((a,b)=>a+b.amt*b.mult,0);
    for (const b of list) {
      const pay = W === 0 ? b.amt : (win.has(b.on) ? Math.round(b.amt*b.mult/W*pool) : 0);
      bal[b.uid] += pay - b.amt;
      hist[b.uid].push({ per:g.per, on:b.on, amt:b.amt, pay, refund:W===0 });
    }
  }
  floor();
  const openG = Object.values(groups).filter(g=>g.per.end >= td);
  const open = clamp(openG.flatMap(g=>g.list.map(b=>({ ...b, per:g.per }))));
  const escrow = {}; for (const b of open) escrow[b.uid] = (escrow[b.uid]||0) + b.amt;
  return { bal, hist, open, avail:u=>Math.max(0,(bal[u]||0)-(escrow[u]||0)) };
}

  const arch = h("select",{id:"p-arch"}, ARCHETYPES.map(a=>h("option",{value:a,selected:a===p.archetype},a)));
  if (!existing && !first.value) {

    h("div",{style:"display:flex;align-items:center;gap:14px;flex-wrap:wrap"}, pv,

        h("label",{class:"btn pop",for:"p-cam"},"📸 Selfie"), h("label",{class:"btn",for:"p-lib"},"Upload"), rm,

function viewMe(L){

/* ---------- render ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let installHidden = false; try { installHidden = localStorage.getItem("himmest.install") === "no"; } catch {}
function installBanner(){
  if (!isIOS || standalone || installHidden) return null;
  return h("div",{class:"install"},
    h("div",{style:"flex:1"}, h("b",null,"Put the Himmest on your iPhone"),
      h("p",{class:"small",style:"margin-top:4px"},"In Safari, tap the Share button (the square with an arrow), then Add to Home Screen. It opens full screen like a real app.")),
    h("button",{class:"btn ghost",style:"border-color:var(--hi-ink);color:var(--hi-ink)","aria-label":"Hide this tip",onclick:()=>{ installHidden=true; try{localStorage.setItem("himmest.install","no")}catch{} render(); }},"Hide"));
}
function viewAuth(){
  let mode = "signup";
  const err = h("div",{class:"err",hidden:true});
  const email = h("input",{id:"a-email",type:"email",placeholder:"you@example.com",autocomplete:"email",inputmode:"email",autocapitalize:"off"});
  const pw = h("input",{id:"a-pw",type:"password",placeholder:"At least 6 characters",autocomplete:"new-password"});
  const btn = h("button",{class:"btn primary huge",type:"submit"},"Join the arena");
  const tabs = h("div",{class:"authtabs",role:"group","aria-label":"Sign up or log in"});
  const setMode = m => {
    mode = m;
    tabs.replaceChildren(
      h("button",{type:"button","aria-pressed":String(m==="signup"),onclick:()=>setMode("signup")},"Sign up"),
      h("button",{type:"button","aria-pressed":String(m==="login"),onclick:()=>setMode("login")},"Log in"));
    btn.textContent = m === "signup" ? "Join the arena" : "Log in";
    pw.setAttribute("autocomplete", m === "signup" ? "new-password" : "current-password");
    err.hidden = true;
  };
  setMode("signup");
  return h("div",{class:"gate stack"}, installBanner(), h("div",{class:"card loud"},
    h("h2",{style:"margin-bottom:6px"},"Who's the Himmest?"),
    h("p",{class:"muted",style:"margin-bottom:14px"},"Vote every day, snap the dumbest moments, log the best quotes and bet on the Him of the Week. Any email works."),
    tabs,
    h("form",{onsubmit:async e=>{
      e.preventDefault(); err.hidden = true; btn.disabled = true;
      try {
        await api("/api/auth",{ method:"POST", body:JSON.stringify({ action:mode, email:email.value, password:pw.value }) });
        const wasSignup = mode === "signup";
        await load(true);
        if (wasSignup) confetti();
      } catch(x) { err.textContent = x.message; err.hidden = false; }
      btn.disabled = false;
    }},
      h("div",{class:"field"}, h("label",{class:"label",for:"a-email"},"Email"), email),
      h("div",{class:"field"}, h("label",{class:"label",for:"a-pw"},"Password"), pw),
      err, btn)));
}
async function logout(){
  try { await api("/api/logout",{ method:"POST" }); } catch {}
  authed = false; S.uid = null; S.email = ""; V = ""; S.loaded = new Set(); render();
}
function render(){
  const main = document.getElementById("main");
  if (authed === false) {
    document.getElementById("tabs").hidden = true;
    document.getElementById("who").replaceChildren();
    D = { td:today(), quotes:[], photos:[], dv:{} }; renderTicker();
    main.replaceChildren(viewAuth());
    return;
  }
  if (authed === null || COLS.some(c=>!S.loaded.has(c))) {
    document.getElementById("tabs").hidden = true;
    main.replaceChildren(loadErr ?
      h("div",{class:"card loud gate"}, h("h2",{style:"margin-bottom:8px"},"Can't reach the arena"), h("p",{class:"muted",style:"margin-bottom:12px"}, loadErr), h("button",{class:"btn primary",onclick:()=>load(true)},"Try again")) :
      h("div",{class:"card empty"}, h("strong",null,"Warming up the jumbotron…"),"Loading today's race."));
    return;
  }
  D = derive(); const L = ledger();
  renderTicker(); renderTabs(); renderWho(L);
  let v;
  if (!isMember(S.uid)) v = h("div",{class:"gate stack"}, installBanner(), h("div",{class:"card loud"},
      h("h2",{style:"margin-bottom:6px"},"Make your profile"),
      h("p",{class:"muted",style:"margin-bottom:14px"},"Add your name and a picture so people can vote for you, quote you, snap your finest moments and bet on you."),
      profileForm(null)));
  else v = h("div",{class:"stack"}, installBanner(), ({ today:viewToday, moments:viewMoments, quotes:viewQuotes, bets:viewBets, ranks:viewRanks, me:viewMe }[S.tab] || viewToday)(L));
  main.replaceChildren(v);
}
function typing(){ const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "file" && document.getElementById("main").contains(a); }
let deferred = false, pickUntil = 0, pickT, loadErr = "", loading = false;
function scheduleRender(){
  if (Date.now() < pickUntil) { clearTimeout(pickT); pickT = setTimeout(scheduleRender, 3000); return; }
  if (typing()) { if (!deferred) { deferred = true; document.activeElement.addEventListener("blur", ()=>{ deferred = false; setTimeout(render,0); }, { once:true }); } return; }
  render();
}
async function load(force){
  if (loading && !force) return;
  loading = true;
  try {
    const j = await api(`/api/state?v=${force ? "" : encodeURIComponent(V)}`);
    loadErr = ""; const was = authed; authed = true; S.uid = j.me.id; S.email = j.me.email;
    if (!j.same) { V = j.v; for (const c of COLS) S[c] = j.cols[c] || {}; COLS.forEach(c=>S.loaded.add(c)); scheduleRender(); }
    else if (was !== true) scheduleRender();
  } catch(e) {
    if (e.status === 401) { if (authed !== false) { authed = false; render(); } }

}
function start(){
  render();

  setInterval(() => { if (authed && Date.now() >= pickUntil && !typing() && !document.querySelector(".lightbox")) render(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && authed) load(false); });

start();
})();
